<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1240">
<title>Forgot Password — Shanmuga Organics</title>
<meta name="description" content="Reset your Shanmuga Organics account password">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .auth-wrapper {
    min-height: calc(100vh - 34px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, var(--green-050) 0%, var(--cream-100) 100%);
  }

  .auth-card {
    background: #fff;
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-l);
    width: 100%;
    max-width: 460px;
    padding: 48px;
  }

  .auth-card__logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .auth-card__logo img {
    width: 112px;
    height: auto;
    max-width: 100%;
    display: block;
    margin: 0 auto;
  }

  .auth-card__title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    margin: 0 0 8px 0;
  }

  .auth-card__subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px 0;
    line-height: 1.6;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-weight: 500;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 12px 16px;
    font-size: 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    transition: all 0.2s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--green-600);
    box-shadow: 0 0 0 3px rgba(47, 143, 67, 0.1);
  }

  .form-input.error {
    border-color: var(--red);
  }

  .form-error {
    display: none;
    color: var(--red);
    font-size: 12px;
    margin-top: 6px;
  }

  .form-error.is-visible {
    display: block;
  }

  .form-actions {
    margin-top: 24px;
  }

  .form-footer {
    margin-top: 24px;
    text-align: center;
  }

  .form-link {
    color: var(--green-600);
    font-weight: 500;
    font-size: 13px;
    text-decoration: none;
    transition: color 0.2s;
  }

  .form-link:hover {
    color: var(--green-700);
    text-decoration: underline;
  }

  .alert {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }

  .alert.is-visible {
    display: block;
  }

  .alert--error {
    background: var(--red-050);
    color: var(--red);
    border: 1px solid rgba(181, 52, 42, 0.2);
  }

  .alert--success {
    background: var(--green-050);
    color: var(--green-800);
    border: 1px solid rgba(47, 143, 67, 0.2);
  }

  .alert--info {
    background: #f0f7fb;
    color: var(--blue);
    border: 1px solid rgba(47, 111, 156, 0.2);
  }

  .btn-loading {
    position: relative;
    pointer-events: none;
    opacity: 0.7;
  }

  .btn-loading::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    top: 50%;
    left: 50%;
    margin-left: -8px;
    margin-top: -8px;
    border: 2px solid #fff;
    border-radius: 50%;
    border-top-color: transparent;
    animation: spinner 0.6s linear infinite;
  }

  @keyframes spinner {
    to { transform: rotate(360deg); }
  }

  .success-icon {
    text-align: center;
    font-size: 48px;
    margin-bottom: 20px;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body data-page="forgot-password">

<div data-shell="header"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card__logo">
      <img src="assets/img/logo.png" alt="Shanmuga Organics">
    </div>

    <!-- Reset Request Form -->
    <div id="requestForm">
      <h1 class="auth-card__title">Forgot Password?</h1>
      <p class="auth-card__subtitle">
        Enter your email address and we'll send you a code to reset your password.
      </p>

      <div id="alertBox" class="alert"></div>

      <form id="resetForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
          <div class="form-error" id="emailError"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--block" id="submitBtn">
            Send Reset Code
          </button>
        </div>

        <div class="form-footer">
          <a href="signin.html" class="form-link">← Back to Sign In</a>
        </div>
      </form>
    </div>

    <!-- Hosted project still uses its existing recovery link until configured separately. -->
    <div id="successMessage" class="hidden">
      <h1 class="auth-card__title">Check Your Email</h1>
      <p class="auth-card__subtitle">If this address has an account, check your inbox for a password reset link.</p>
      <div class="form-footer"><a href="signin.html" class="form-link">Back to Sign In</a></div>
    </div>

  </div>
</div>

<div data-shell="footer"></div>

<script src="plugins/supabase/supabase.umd.js"></script>
<script src="plugins/supabase/supabase-client.js"></script>
<script src="assets/js/shell.js"></script>
<script>
(function () {
  'use strict';

  const form = document.getElementById('resetForm');
  const emailInput = document.getElementById('email');
  const submitBtn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alertBox');
  const successMessage = document.getElementById('successMessage');
  const requestForm = document.getElementById('requestForm');
  const isLocal = /^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(window.location.origin);
  const previewUrl = 'http://localhost:4173/forgot-password.html';
  if (!isLocal) {
    document.querySelector('#requestForm .auth-card__subtitle').textContent =
      "Enter your email address and we'll send you a link to reset your password.";
    submitBtn.textContent = 'Send Reset Link';
  }

  // Show alert message
  function showAlert(message, type = 'error') {
    alertBox.textContent = message;
    alertBox.className = `alert alert--${type} is-visible`;
    alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Hide alert message
  function hideAlert() {
    alertBox.className = 'alert';
  }

  function showLocalPreviewAlert(message) {
    showAlert(message);
    const link = document.createElement('a');
    link.href = previewUrl;
    link.textContent = 'Open the local Forgot Password page';
    link.style.display = 'block';
    link.style.marginTop = '8px';
    alertBox.appendChild(link);
  }

  // Live Server (and other static servers) cannot inject the local Auth config.
  // Probe a public image first: only redirect when the dedicated preview is up.
  // Never use the hosted project as a fallback for a localhost page.
  if (isLocal && !window.__soSupabaseConfig) {
    if (window.location.origin !== 'http://localhost:4173' &&
        window.location.origin !== 'http://127.0.0.1:4173') {
      const probe = new Image();
      probe.onload = () => window.location.replace(previewUrl);
      probe.onerror = () => {
        showLocalPreviewAlert('The local preview is not running. Start Docker Supabase, run npm run dev from the project folder, then open the preview link below.');
      };
      probe.src = 'http://localhost:4173/assets/img/favicon.svg';
    } else {
      showLocalPreviewAlert('Local Supabase configuration is unavailable. Make sure Docker Supabase is running and refresh this page.');
    }
  }

  // Validate email
  function validateEmail(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
  }

  // Handle form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (submitBtn.disabled) return;
    hideAlert();

    const email = emailInput.value.trim();

    // Validation
    if (!email || !validateEmail(email)) {
      showAlert('Please enter a valid email address');
      emailInput.focus();
      return;
    }

    // Show loading state
    submitBtn.disabled = true;
    submitBtn.classList.add('btn-loading');
    submitBtn.textContent = '';

    let timeoutId;
    try {
      if (!window.SupabaseClient || !window.Supabase?.resetPassword) {
        throw new Error(isLocal && !window.__soSupabaseConfig
          ? 'Local Supabase configuration is missing. Use the local preview link below (not Live Server).'
          : isLocal
          ? 'Local password reset service unavailable. Refresh the local preview and check that Supabase is running.'
          : 'Password reset service unavailable. Please try again later.');
      }
      const { error } = await Promise.race([
        Promise.resolve().then(() => window.Supabase.resetPassword(email)),
        new Promise((_, reject) => {
          timeoutId = setTimeout(() => reject(new Error(
            isLocal
              ? 'Request timed out. Check local Mailpit for a reset code before trying again.'
              : 'Request timed out. Check your inbox for a reset code before trying again.'
          )), 15000);
        })
      ]);

      if (error) {
        throw new Error(typeof error === 'string' ? error : error?.message || 'Failed to send reset code.');
      }

      if (isLocal) {
        try { sessionStorage.setItem('so_pending_recovery_email', email); } catch (e) { /* private mode */ }
        window.location.href = 'verify-otp.html?mode=recovery&email=' + encodeURIComponent(email);
      } else {
        requestForm.classList.add('hidden');
        successMessage.classList.remove('hidden');
      }

    } catch (error) {
      console.error('Password reset error:', error);

      const message = typeof error === 'string' ? error : error?.message || '';
      const errorMessage = message || 'Failed to send reset code. Please try again.';

      if (message.toLowerCase().includes('not found')) {
        // Do not reveal whether the address has an account.
        if (isLocal) {
          try { sessionStorage.setItem('so_pending_recovery_email', email); } catch (e) { /* private mode */ }
          window.location.href = 'verify-otp.html?mode=recovery&email=' + encodeURIComponent(email);
        } else {
          requestForm.classList.add('hidden');
          successMessage.classList.remove('hidden');
        }
      } else {
        if (isLocal && !window.__soSupabaseConfig) showLocalPreviewAlert(errorMessage);
        else showAlert(errorMessage);
      }
    } finally {
      clearTimeout(timeoutId);
      submitBtn.classList.remove('btn-loading');
      submitBtn.textContent = isLocal ? 'Send Reset Code' : 'Send Reset Link';
      submitBtn.disabled = false;
    }
  });

  // Allow access to forgot password page even if logged in
  // Users might want to reset their password
})();
</script>

  <script src="plugins/cms/content-cms.js?v=1"></script>
</body>
</html>
