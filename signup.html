<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1240">
<title>Sign Up — Shanmuga Organics</title>
<meta name="description" content="Create your Shanmuga Organics account">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .auth-wrapper {
    min-height: calc(100vh - 34px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, var(--green-050) 0%, var(--cream-100) 100%);
  }

  .auth-card {
    background: #fff;
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-l);
    width: 100%;
    max-width: 460px;
    padding: 48px;
  }

  .auth-card__logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .auth-card__logo img {
    height: 48px;
    margin: 0 auto;
  }

  .auth-card__title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    margin: 0 0 8px 0;
  }

  .auth-card__subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px 0;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-weight: 500;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 12px 16px;
    font-size: 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    transition: all 0.2s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--green-600);
    box-shadow: 0 0 0 3px rgba(47, 143, 67, 0.1);
  }

  .form-input.error {
    border-color: var(--red);
  }

  .form-error {
    display: none;
    color: var(--red);
    font-size: 12px;
    margin-top: 6px;
  }

  .form-error.is-visible {
    display: block;
  }

  .form-actions {
    margin-top: 24px;
  }

  .form-footer {
    margin-top: 24px;
    text-align: center;
  }

  .form-link {
    color: var(--green-600);
    font-weight: 500;
    font-size: 13px;
    text-decoration: none;
    transition: color 0.2s;
  }

  .form-link:hover {
    color: var(--green-700);
    text-decoration: underline;
  }

  .divider {
    display: flex;
    align-items: center;
    margin: 24px 0;
    color: var(--muted);
    font-size: 13px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .divider::before {
    margin-right: 12px;
  }

  .divider::after {
    margin-left: 12px;
  }

  .alert {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }

  .alert.is-visible {
    display: block;
  }

  .alert--error {
    background: var(--red-050);
    color: var(--red);
    border: 1px solid rgba(181, 52, 42, 0.2);
  }

  .alert--success {
    background: var(--green-050);
    color: var(--green-800);
    border: 1px solid rgba(47, 143, 67, 0.2);
  }

  .password-strength {
    margin-top: 8px;
    font-size: 12px;
  }

  .password-strength__bar {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .password-strength__fill {
    height: 100%;
    width: 0%;
    transition: all 0.3s;
    border-radius: 2px;
  }

  .password-strength__fill.weak {
    width: 33%;
    background: var(--red);
  }

  .password-strength__fill.medium {
    width: 66%;
    background: #d99b2b;
  }

  .password-strength__fill.strong {
    width: 100%;
    background: var(--green-600);
  }

  .password-strength__text {
    color: var(--muted);
  }

  .btn-loading {
    position: relative;
    pointer-events: none;
    opacity: 0.7;
  }

  .btn-loading::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    top: 50%;
    left: 50%;
    margin-left: -8px;
    margin-top: -8px;
    border: 2px solid #fff;
    border-radius: 50%;
    border-top-color: transparent;
    animation: spinner 0.6s linear infinite;
  }

  @keyframes spinner {
    to { transform: rotate(360deg); }
  }

  .checkbox-group {
    display: flex;
    align-items: flex-start;
    margin-top: 20px;
  }

  .checkbox-group input[type="checkbox"] {
    margin-right: 8px;
    margin-top: 3px;
  }

  .checkbox-group label {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  /* Password field wrapper with eye toggle */
  .password-field {
    position: relative;
  }

  .password-field .form-input {
    padding-right: 44px;
  }

  .password-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1;
    width: 36px;
    height: 36px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
  }

  .password-toggle:hover {
    color: var(--green-700);
    background: var(--green-050);
  }

  .password-toggle:focus-visible {
    outline: 2px solid var(--green-600);
    outline-offset: 2px;
    color: var(--green-700);
  }

  .password-toggle svg {
    width: 18px;
    height: 18px;
    pointer-events: none;
  }
</style>
</head>
<body data-page="signup">

<div data-shell="header"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card__logo">
      <img src="assets/img/logo.png" alt="Shanmuga Organics">
    </div>

    <h1 class="auth-card__title">Create Account</h1>
    <p class="auth-card__subtitle">Join us for fresh, organic products</p>

    <div id="alertBox" class="alert"></div>

    <form id="signupForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          class="form-input"
          placeholder="Your full name"
          required
          autocomplete="name"
        >
        <div class="form-error" id="fullNameError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-input"
          placeholder="you@example.com"
          required
          autocomplete="email"
        >
        <div class="form-error" id="emailError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Mobile Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          class="form-input"
          placeholder="+91 9876543210"
          required
          autocomplete="tel"
          inputmode="tel"
          pattern="[0-9+\-\s()]{10,20}"
          maxlength="20"
        >
        <div class="form-error" id="phoneError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Create a strong password"
            required
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M3 3l18 18"/><path d="M10.6 6.1A10.5 10.5 0 0112 6c6 0 9.5 6 9.5 6a13.2 13.2 0 01-3.4 4.2"/><path d="M6.6 6.6A13.2 13.2 0 002.5 12s3.5 6 9.5 6c1.3 0 2.5-.2 3.6-.7"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
          </button>
        </div>
        <div class="password-strength">
          <div class="password-strength__bar">
            <div class="password-strength__fill" id="strengthFill"></div>
          </div>
          <div class="password-strength__text" id="strengthText"></div>
        </div>
        <div class="form-error" id="passwordError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <div class="password-field">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input"
            placeholder="Re-enter your password"
            required
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle" data-toggle-password="confirmPassword" aria-label="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M3 3l18 18"/><path d="M10.6 6.1A10.5 10.5 0 0112 6c6 0 9.5 6 9.5 6a13.2 13.2 0 01-3.4 4.2"/><path d="M6.6 6.6A13.2 13.2 0 002.5 12s3.5 6 9.5 6c1.3 0 2.5-.2 3.6-.7"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
          </button>
        </div>
        <div class="form-error" id="confirmPasswordError"></div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">
          I agree to the <a href="terms.html" class="form-link" target="_blank">Terms & Conditions</a> and <a href="privacy.html" class="form-link" target="_blank">Privacy Policy</a>
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary btn--block" id="submitBtn">
          Create Account
        </button>
      </div>

      <div class="divider">or</div>

      <div class="form-footer">
        Already have an account? <a href="signin.html" class="form-link">Sign in</a>
      </div>
    </form>
  </div>
</div>

<div data-shell="footer"></div>

<!-- Keep password visibility usable even when the external signup/auth scripts fail to load. -->
<script id="signup-password-visibility">
  document.querySelectorAll('.password-toggle[data-toggle-password]').forEach(function (toggle) {
    toggle.addEventListener('click', function () {
      const input = document.getElementById(toggle.getAttribute('data-toggle-password'));
      if (!input) return;
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      toggle.querySelector('.eye-open').style.display = visible ? 'none' : 'block';
      toggle.querySelector('.eye-off').style.display = visible ? 'block' : 'none';
      toggle.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
      toggle.setAttribute('aria-pressed', String(visible));
    });
  });
</script>
<script src="plugins/supabase/supabase.umd.js"></script>
<script src="plugins/supabase/supabase-client.js?v=6"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/signup-email.js?v=5"></script>

  <script src="plugins/cms/content-cms.js?v=2"></script>
</body>
</html>
