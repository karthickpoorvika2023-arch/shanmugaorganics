<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1240">
<title>Sign In — Shanmuga Organics</title>
<meta name="description" content="Sign in to your Shanmuga Organics account">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .auth-wrapper {
    min-height: calc(100vh - 34px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, var(--green-050) 0%, var(--cream-100) 100%);
  }

  .auth-card {
    background: #fff;
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-l);
    width: 100%;
    max-width: 460px;
    padding: 48px;
  }

  .auth-card__logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .auth-card__logo img {
    height: 48px;
    margin: 0 auto;
  }

  .auth-card__title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    margin: 0 0 8px 0;
  }

  .auth-card__subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px 0;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-weight: 500;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 12px 16px;
    font-size: 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    transition: all 0.2s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--green-600);
    box-shadow: 0 0 0 3px rgba(47, 143, 67, 0.1);
  }

  .form-input.error {
    border-color: var(--red);
  }

  .form-error {
    display: none;
    color: var(--red);
    font-size: 12px;
    margin-top: 6px;
  }

  .form-error.is-visible {
    display: block;
  }

  .form-actions {
    margin-top: 24px;
  }

  .form-footer {
    margin-top: 24px;
    text-align: center;
  }


  .form-link {
    color: var(--green-600);
    font-weight: 500;
    font-size: 13px;
    text-decoration: none;
    transition: color 0.2s;
  }

  .form-link:hover {
    color: var(--green-700);
    text-decoration: underline;
  }

  .divider {
    display: flex;
    align-items: center;
    margin: 24px 0;
    color: var(--muted);
    font-size: 13px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .divider::before {
    margin-right: 12px;
  }

  .divider::after {
    margin-left: 12px;
  }

  .alert {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }

  .alert.is-visible {
    display: block;
  }

  .alert--error {
    background: var(--red-050);
    color: var(--red);
    border: 1px solid rgba(181, 52, 42, 0.2);
  }

  .alert--success {
    background: var(--green-050);
    color: var(--green-800);
    border: 1px solid rgba(47, 143, 67, 0.2);
  }

  .btn-loading {
    position: relative;
    pointer-events: none;
    opacity: 0.7;
  }

  .btn-loading::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    top: 50%;
    left: 50%;
    margin-left: -8px;
    margin-top: -8px;
    border: 2px solid #fff;
    border-radius: 50%;
    border-top-color: transparent;
    animation: spinner 0.6s linear infinite;
  }

  /* Password field wrapper with eye toggle */
  .password-field {
    position: relative;
  }

  .password-field .form-input {
    padding-right: 44px;
  }

  .password-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
  }

  .password-toggle:hover {
    color: var(--green-700);
    background: var(--green-050);
  }

  .password-toggle:focus {
    outline: none;
    color: var(--green-700);
  }

  .password-toggle svg {
    width: 18px;
    height: 18px;
  }

  @keyframes spinner {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body data-page="signin">

<div data-shell="header"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card__logo">
      <img src="assets/img/logo.png" alt="Shanmuga Organics">
    </div>

    <h1 class="auth-card__title">Welcome Back</h1>
    <p class="auth-card__subtitle">Sign in to your account to continue</p>

    <div id="alertBox" class="alert"></div>

    <form id="signinForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-input"
          placeholder="you@example.com"
          required
          autocomplete="email"
        >
        <div class="form-error" id="emailError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M3 3l18 18"/><path d="M10.6 6.1A10.5 10.5 0 0112 6c6 0 9.5 6 9.5 6a13.2 13.2 0 01-3.4 4.2"/><path d="M6.6 6.6A13.2 13.2 0 002.5 12s3.5 6 9.5 6c1.3 0 2.5-.2 3.6-.7"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
          </button>
        </div>
        <div class="form-error" id="passwordError"></div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary btn--block" id="submitBtn">
          Sign In
        </button>
      </div>


      <div class="form-footer">
        <a href="forgot-password.html" class="form-link">Forgot your password?</a>
      </div>

      <div class="divider">or</div>

      <div class="form-footer">
        Don't have an account? <a href="signup.html" class="form-link">Sign up</a>
      </div>
    </form>
  </div>
</div>

<div data-shell="footer"></div>

<script src="plugins/supabase/supabase.umd.js"></script>
<script src="plugins/supabase/supabase-client.js?v=6"></script>
<script src="assets/js/auth-ui.js"></script>
<script src="assets/js/shell.js"></script>
<script>
(function () {
  'use strict';

  const form = document.getElementById('signinForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const submitBtn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alertBox');

  // Visibility is a local UI control: it must work even if Auth fails to load.
  document.querySelectorAll('.password-toggle[data-toggle-password]').forEach(function (toggle) {
    toggle.addEventListener('click', function () {
      const input = document.getElementById(toggle.getAttribute('data-toggle-password'));
      const eyeOpen = toggle.querySelector('.eye-open');
      const eyeOff = toggle.querySelector('.eye-off');
      if (!input || !eyeOpen || !eyeOff) return;
      const reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      eyeOpen.style.display = reveal ? 'none' : 'block';
      eyeOff.style.display = reveal ? 'block' : 'none';
      toggle.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
      toggle.setAttribute('aria-pressed', String(reveal));
    });
  });

  function safeTarget() {
    const requested = new URLSearchParams(window.location.search).get('redirect');
    if (!requested) return 'account.html';
    try {
      const url = new URL(requested, window.location.href);
      if (url.origin === window.location.origin && url.protocol === window.location.protocol) return url.href;
    } catch (e) { /* invalid redirect */ }
    return 'account.html';
  }


  // Show alert message
  function showAlert(message, type = 'error') {
    alertBox.textContent = message;
    alertBox.className = `alert alert--${type} is-visible`;
    alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Hide alert message
  function hideAlert() {
    alertBox.className = 'alert';
  }

  // Validate email
  function validateEmail(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
  }

  // Handle form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    // Basic validation
    if (!email || !validateEmail(email)) {
      showAlert('Please enter a valid email address');
      emailInput.focus();
      return;
    }

    if (!password || password.length < 6) {
      showAlert('Password must be at least 6 characters');
      passwordInput.focus();
      return;
    }

    const localOtp = /^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(window.location.origin) &&
      /^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(window.__soSupabaseConfig?.url || '');
    if (!window.Supabase || typeof window.Supabase.signIn !== 'function' || !window.Supabase.client) {
      showAlert('Sign-in service unavailable. Open the local preview at http://localhost:4173/signin.html, then refresh.');
      return;
    }

    // Show loading state
    submitBtn.classList.add('btn-loading');
    submitBtn.textContent = '';

    try {
      if (localOtp) {
        const response = await fetch('/__local/signin-otp/start', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await response.json();
        if (!response.ok || !result.sent) throw new Error(result.error || 'Could not send the sign-in code.');
        try { sessionStorage.setItem('so_pending_signin_email', email); } catch (e) { /* private mode */ }
        window.location.href = 'verify-otp.html?mode=signin&email=' + encodeURIComponent(email);
        return;
      }
      const { error } = await window.Supabase.signIn(email, password);

      if (error) {
        throw error;
      }

      // Success - redirect to original page if specified, else account page
      showAlert('Sign in successful! Redirecting...', 'success');

      const target = safeTarget();

      setTimeout(() => {
        window.location.href = target;
      }, 1000);

    } catch (error) {
      console.error('Sign in error:', error);

      let errorMessage = 'Failed to sign in. Please check your credentials.';

      if (error?.message?.includes('Invalid login credentials')) {
        errorMessage = 'Invalid email or password. Please try again.';
      } else if (error?.message?.includes('Email not confirmed')) {
        errorMessage = 'Please confirm your email using the OTP we sent before signing in. Check Inbox or Spam, or use Resend on the verification page.';
      } else if (error?.message) {
        errorMessage = error.message;
      }

      showAlert(errorMessage);

      // Reset button
      submitBtn.classList.remove('btn-loading');
      submitBtn.textContent = 'Sign In';

    }
  });

  // Check for URL parameters (e.g., a protected page redirect)
  const urlParams = new URLSearchParams(window.location.search);
  const message = urlParams.get('message');
  if (window.Supabase && typeof window.Supabase.isAuthenticated === 'function') {
    window.Supabase.isAuthenticated().then(isAuth => {
      if (isAuth) window.location.href = 'account.html';
    }).catch(function () { /* Keep the sign-in form usable if the session check fails. */ });
  }

  if (message === 'verify') {
    showAlert('Please check your email and verify your account before signing in.', 'success');
  } else if (message === 'verified') {
    showAlert('Email verified successfully! You can now sign in.', 'success');
  } else if (message === 'reset') {
    showAlert('Password reset successfully! You can now sign in with your new password.', 'success');
  } else if (message === 'signin') {
    showAlert('Please sign in to add items to your cart and continue shopping.', 'success');
  }

  // Email handed over by signup.html → pre-fill it and jump
  // the cursor to the password field.
  const prefillEmail = urlParams.get('email');
  if (prefillEmail && !emailInput.value) {
    emailInput.value = prefillEmail;
    passwordInput.focus();
  }

})();
</script>

  <script src="plugins/cms/content-cms.js?v=1"></script>
</body>
</html>
