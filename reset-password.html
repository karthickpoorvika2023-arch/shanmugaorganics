<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1240">
<title>Reset Password — Shanmuga Organics</title>
<meta name="description" content="Reset your Shanmuga Organics account password">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .auth-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, var(--green-050) 0%, var(--cream-100) 100%);
  }

  .auth-card {
    background: #fff;
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-l);
    width: 100%;
    max-width: 460px;
    padding: 48px;
  }

  .auth-card__logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .auth-card__logo img {
    width: 112px;
    height: auto;
    max-width: 100%;
    display: block;
    margin: 0 auto;
  }

  .auth-card__title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    margin: 0 0 8px 0;
  }

  .auth-card__subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px 0;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-weight: 500;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 12px 16px;
    font-size: 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    transition: all 0.2s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--green-600);
    box-shadow: 0 0 0 3px rgba(47, 143, 67, 0.1);
  }

  .form-input.error {
    border-color: var(--red);
  }

  .form-input-wrapper {
    position: relative;
  }

  .form-input-wrapper .form-input {
    padding-right: 48px;
  }

  .password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--muted);
    border-radius: var(--radius);
    transition: all 0.2s;
  }

  .password-toggle:hover {
    color: var(--ink);
    background: var(--green-050);
  }

  .password-toggle:focus-visible {
    outline: 2px solid var(--green-600);
    outline-offset: 2px;
  }

  .password-toggle .icon-eye-open {
    display: block;
  }

  .password-toggle .icon-eye-closed {
    display: none;
  }

  .password-toggle[aria-pressed="true"] .icon-eye-open {
    display: none;
  }

  .password-toggle[aria-pressed="true"] .icon-eye-closed {
    display: block;
  }

  .form-error {
    display: none;
    color: var(--red);
    font-size: 12px;
    margin-top: 6px;
  }

  .form-error.is-visible {
    display: block;
  }

  .form-actions {
    margin-top: 24px;
  }

  .form-footer {
    margin-top: 24px;
    text-align: center;
  }

  .form-link {
    color: var(--green-600);
    font-weight: 500;
    font-size: 13px;
    text-decoration: none;
    transition: color 0.2s;
  }

  .form-link:hover {
    color: var(--green-700);
    text-decoration: underline;
  }

  .alert {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }

  .alert.is-visible {
    display: block;
  }

  .alert--error {
    background: var(--red-050);
    color: var(--red);
    border: 1px solid rgba(181, 52, 42, 0.2);
  }

  .alert--success {
    background: var(--green-050);
    color: var(--green-800);
    border: 1px solid rgba(47, 143, 67, 0.2);
  }

  .password-strength {
    margin-top: 8px;
    font-size: 12px;
  }

  .password-strength__bar {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .password-strength__fill {
    height: 100%;
    width: 0%;
    transition: all 0.3s;
    border-radius: 2px;
  }

  .password-strength__fill.weak {
    width: 33%;
    background: var(--red);
  }

  .password-strength__fill.medium {
    width: 66%;
    background: #d99b2b;
  }

  .password-strength__fill.strong {
    width: 100%;
    background: var(--green-600);
  }

  .password-strength__text {
    color: var(--muted);
  }

  .btn-loading {
    position: relative;
    pointer-events: none;
    opacity: 0.7;
  }

  .btn-loading::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    top: 50%;
    left: 50%;
    margin-left: -8px;
    margin-top: -8px;
    border: 2px solid #fff;
    border-radius: 50%;
    border-top-color: transparent;
    animation: spinner 0.6s linear infinite;
  }

  @keyframes spinner {
    to { transform: rotate(360deg); }
  }

  .hidden {
    display: none;
  }

  .spinner-wrapper {
    text-align: center;
    padding: 40px 0;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--line);
    border-top-color: var(--green-600);
    border-radius: 50%;
    animation: spinner 0.8s linear infinite;
    margin: 0 auto 24px;
  }
</style>
</head>
<body data-page="reset-password">

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card__logo">
      <img src="assets/img/logo.png" alt="Shanmuga Organics">
    </div>

    <!-- Loading State -->
    <div id="loadingState">
      <div class="spinner-wrapper">
        <div class="spinner"></div>
        <p class="auth-card__subtitle">Validating reset link...</p>
      </div>
    </div>

    <!-- Reset Form -->
    <div id="resetForm" class="hidden">
      <h1 class="auth-card__title">Reset Password</h1>
      <p class="auth-card__subtitle">Enter your new password below</p>

      <div id="alertBox" class="alert"></div>

      <form id="passwordResetForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <div class="form-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Create a strong password"
              required
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="password-strength">
            <div class="password-strength__bar">
              <div class="password-strength__fill" id="strengthFill"></div>
            </div>
            <div class="password-strength__text" id="strengthText"></div>
          </div>
          <div class="form-error" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="form-input-wrapper">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              placeholder="Re-enter your password"
              required
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="form-error" id="confirmPasswordError"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--block" id="submitBtn">
            Reset Password
          </button>
        </div>

        <div class="form-footer">
          <a href="signin.html" class="form-link">← Back to Sign In</a>
        </div>
      </form>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden">
      <h1 class="auth-card__title">Invalid Link</h1>
      <div class="alert alert--error is-visible">
        This password reset link is invalid or has expired.
      </div>
      <p class="auth-card__subtitle">
        Please request a new password reset link.
      </p>
      <div class="form-footer">
        <a href="forgot-password.html" class="btn btn--primary btn--block">Request New Link</a>
      </div>
    </div>
  </div>
</div>

<script src="plugins/supabase/supabase.umd.js"></script>
<script src="plugins/supabase/supabase-client.js"></script>
<script>
(function () {
  'use strict';

  // Verify Supabase is loaded
  if (!window.SupabaseClient) {
    console.error('Supabase client not initialized. Check network connection and script loading order.');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    if (loadingState) loadingState.classList.add('hidden');
    if (errorState) {
      errorState.classList.remove('hidden');
      errorState.querySelector('.alert').textContent = 'Unable to load authentication service. Please check your connection and try again.';
    }
    return;
  }

  const loadingState = document.getElementById('loadingState');
  const resetForm = document.getElementById('resetForm');
  const errorState = document.getElementById('errorState');
  const form = document.getElementById('passwordResetForm');
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirmPassword');
  const togglePassword = document.getElementById('togglePassword');
  const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
  const submitBtn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alertBox');
  const strengthFill = document.getElementById('strengthFill');
  const strengthText = document.getElementById('strengthText');

  // Show alert message
  function showAlert(message, type = 'error') {
    alertBox.textContent = message;
    alertBox.className = `alert alert--${type} is-visible`;
    alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Hide alert message
  function hideAlert() {
    alertBox.className = 'alert';
  }

  // Check password strength
  function checkPasswordStrength(password) {
    let strength = 0;

    if (password.length >= 8) strength++;
    if (password.length >= 12) strength++;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
    if (/\d/.test(password)) strength++;
    if (/[^a-zA-Z0-9]/.test(password)) strength++;

    return strength;
  }

  // Update password strength indicator
  passwordInput.addEventListener('input', () => {
    const password = passwordInput.value;

    if (!password) {
      strengthFill.className = 'password-strength__fill';
      strengthText.textContent = '';
      return;
    }

    const strength = checkPasswordStrength(password);

    if (strength <= 2) {
      strengthFill.className = 'password-strength__fill weak';
      strengthText.textContent = 'Weak password';
    } else if (strength <= 3) {
      strengthFill.className = 'password-strength__fill medium';
      strengthText.textContent = 'Medium strength';
    } else {
      strengthFill.className = 'password-strength__fill strong';
      strengthText.textContent = 'Strong password';
    }
  });

  // Password toggle functionality
  function setupPasswordToggle(toggleBtn, input) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      toggleBtn.setAttribute('aria-pressed', isPassword);
      toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });
  }

  setupPasswordToggle(togglePassword, passwordInput);
  setupPasswordToggle(toggleConfirmPassword, confirmPasswordInput);

  // Validate reset token
  async function validateResetToken() {
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = hashParams.get('access_token');
    const type = hashParams.get('type');

    let verifiedEmail = '';
    try { verifiedEmail = sessionStorage.getItem('so_verified_recovery_email') || ''; } catch (e) { /* private mode */ }
    if ((accessToken && type === 'recovery') || verifiedEmail) {
      try {
        if (accessToken && type === 'recovery') {
          // Accept existing recovery links, but never a session without a recovery token or verified OTP.
          const { error } = await window.SupabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: hashParams.get('refresh_token')
          });
          if (error) throw error;
        } else {
          const { data: sessionData, error: sessionError } = await window.SupabaseClient.auth.getSession();
          if (sessionError || !sessionData?.session) throw sessionError || new Error('No verified recovery session');
          const { data: userData, error: userError } = await window.SupabaseClient.auth.getUser();
          if (userError || userData?.user?.email?.toLowerCase() !== verifiedEmail.toLowerCase()) {
            throw userError || new Error('Verified recovery email does not match this session');
          }
          try { sessionStorage.removeItem('so_verified_recovery_email'); } catch (e) { /* private mode */ }
        }

        // Token is valid, show the form
        loadingState.classList.add('hidden');
        resetForm.classList.remove('hidden');

      } catch (error) {
        console.error('Token validation error:', error);
        loadingState.classList.add('hidden');
        errorState.classList.remove('hidden');
      }
    } else {
      // No valid token found
      loadingState.classList.add('hidden');
      errorState.classList.remove('hidden');
    }
  }

  // Handle form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    // Validation
    if (!password || password.length < 8) {
      showAlert('Password must be at least 8 characters long');
      passwordInput.focus();
      return;
    }

    if (password !== confirmPassword) {
      showAlert('Passwords do not match');
      confirmPasswordInput.focus();
      return;
    }

    // Show loading state
    submitBtn.classList.add('btn-loading');
    submitBtn.textContent = '';

    try {
      const { data, error } = await window.SupabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        throw error;
      }

      // Do not open the storefront until the OTP and the new password are complete.
      showAlert('Password reset successfully! Opening the home page...', 'success');

      setTimeout(() => {
        window.location.href = './';
      }, 2000);

    } catch (error) {
      console.error('Password reset error:', error);

      let errorMessage = 'Failed to reset password. Please try again.';

      if (error.message.includes('weak')) {
        errorMessage = 'Password is too weak. Please use a stronger password.';
      } else if (error.message) {
        errorMessage = error.message;
      }

      showAlert(errorMessage);

      // Reset button
      submitBtn.classList.remove('btn-loading');
      submitBtn.textContent = 'Reset Password';
    }
  });

  // Validate token on page load
  validateResetToken();
})();
</script>

</body>
</html>
